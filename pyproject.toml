[project]
name = "lazy-skills-mcp"
version = "0.2.0"
description = "Agent Skills on-demand lazy-loading MCP server for coding agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["attrs>=24.1", "mcp>=2.2,<3", "pyyaml>=6.0.1"]

[project.urls]
Homepage = "https://github.com/jonatsu/lazy-skills-mcp"
Repository = "https://github.com/jonatsu/lazy-skills-mcp"
Changelog = "https://github.com/jonatsu/lazy-skills-mcp/blob/main/CHANGELOG.md"

[project.scripts]
lazy-skills-mcp = "lazy_skills_mcp.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lazy_skills_mcp"

[dependency-groups]
dev = [
    "pip-audit>=2.9",
    "pre-commit>=4.0",
    "twine>=6.1",
]
lint = [
    "mypy==2.3.0",
    "ruff==0.12.0",
    "types-pyyaml>=6.0",
]
test = ["pytest>=8.0"]

[tool.uv]
default-groups = ["test", "lint", "dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
markers = [
  "anyio: exercises the async in-memory MCP client (asyncio backend only, see conftest.py)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# The repository baseline plus the families this code exercises: filesystem
# paths (PTH, for skill folder resolution and confinement) and security checks
# (S, which flags unsafe YAML loading of frontmatter from untrusted skill folders).
select = ["E", "F", "I", "UP", "B", "SIM", "W", "C4", "N", "PTH", "RUF", "TID", "FBT", "S"]
ignore = ["E501"]  # line length handled by the formatter

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-local-folder = ["skill_tree"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/lazy_skills_mcp", "tests"]

[tool.pyright]
# Tests import their shared helpers (tests/skill_tree.py) as top-level modules, as
# pytest's default import mode puts tests/ on sys.path.
extraPaths = ["src", "tests"]
