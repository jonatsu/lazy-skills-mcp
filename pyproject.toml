[project]
name = "skill-server"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["attrs>=24.1", "mcp>=2.2,<3", "pyyaml>=6.0"]

[project.scripts]
skill-server = "skillserverlib.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "skillserverlib"

[dependency-groups]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
markers = [
  "anyio: exercises the async in-memory MCP client (asyncio backend only, see conftest.py)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# The repository baseline plus the families this code exercises: filesystem
# paths (skill directory resolution and confinement) and YAML frontmatter read
# from an untrusted skill directory.
select = ["E", "F", "I", "UP", "B", "SIM", "W", "C4", "N", "PTH", "RUF", "TID", "FBT"]
ignore = ["E501"]  # line length handled by the formatter

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/skillserverlib", "tests"]
